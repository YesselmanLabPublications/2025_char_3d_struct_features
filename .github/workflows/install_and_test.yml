name: Install and Test DMS 3D Features

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Micromamba (creates a fresh, isolated environment from environment.yml)
      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          environment-name: dms-3d-features
          cache-downloads: true
          cache-environment: true

      # Cache the datasets (same cache key across OSes)
      - name: Restore cached dataset
        uses: actions/cache@v4
        with:
          path: data
          key: figshare-data-v2

      # Download and unzip if not cached
      - name: Download and unzip datasets
        shell: bash -l {0}
        run: |
          if [ -d "data" ]; then
            echo "✅ Using cached dataset."
            exit 0
          fi

          mkdir -p data

          # Each entry: "<output-zip> <figshare-file-url>"
          downloads=(
            "data.zip          https://ndownloader.figshare.com/files/66482813"
            "farfar-models.zip https://ndownloader.figshare.com/files/64021168"
            "pngs.zip          https://ndownloader.figshare.com/files/66482831"
          )

          for entry in "${downloads[@]}"; do
            out=$(echo "$entry" | awk '{print $1}')
            url=$(echo "$entry" | awk '{print $2}')
            echo "Downloading $out from $url ..."
            # -C - resumes a partial download; retries + headers avoid 403
            curl -fL -C - --retry 8 --retry-delay 5 --retry-all-errors \
                 -H "User-Agent: Mozilla/5.0" \
                 -H "Referer: https://figshare.com/" \
                 -o "$out" "$url"
            # Verify the download is a valid zip
            if ! unzip -tq "$out" > /dev/null 2>&1; then
              echo "❌ $out is not a valid zip. Exiting." >&2
              rm -f "$out"
              exit 1
            fi
            echo "Unzipping $out into data/ ..."
            unzip -q "$out" -d data
            rm -f "$out"
          done

      # Install package into the fresh environment (needed to import dms_3d_features)
      - name: Install package
        shell: bash -l {0}
        run: |
          micromamba run -n dms-3d-features pip install -e .

      # Sanity-check that the input data the script needs is actually present
      - name: Check required input data
        shell: bash -l {0}
        run: |
          missing=0
          for f in \
            data/raw-jsons/constructs/pdb_library_1.json \
            data/raw-jsons/constructs/pdb_library_denature.json \
            data/raw-jsons/constructs/pdb_library_nomod.json; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing required input file: $f" >&2
              missing=1
            else
              echo "✅ Found $f"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Required inputs for process_motifs.py are not in the dataset." >&2
            echo "Contents of data/raw-jsons/constructs (if any):" >&2
            ls -lh data/raw-jsons/constructs 2>/dev/null || echo "(directory does not exist)"
            exit 1
          fi

      # Create the output directories process_motifs.py writes into
      # (main() calls to_json/to_csv into these paths and will fail if they don't exist)
      - name: Prepare output directories
        shell: bash -l {0}
        run: |
          mkdir -p \
            data/raw-jsons/motifs \
            data/raw-jsons/residues \
            data/revisions/normalized/constructs \
            data/revisions/normalized/motifs \
            data/revisions/normalized/residues \
            data/revisions/dif_threshold/motifs \
            data/revisions/dif_threshold/residues \
            data/pdb-features

      # Run the target script end-to-end in the fresh environment.
      # This is the "does the repo actually work?" check.
      - name: Run process_motifs.py
        shell: bash -l {0}
        run: |
          micromamba run -n dms-3d-features python dms_3d_features/process_motifs.py

      # Confirm the script produced its expected outputs
      - name: Verify process_motifs.py outputs
        shell: bash -l {0}
        run: |
          test -f data/raw-jsons/motifs/pdb_library_1_motifs_avg.json \
            && echo "✅ motif output written" \
            || (echo "❌ expected motif output missing" >&2; exit 1)
          echo "Generated files:"
          ls -lh data/raw-jsons/motifs data/raw-jsons/residues

      # Optional: also run the pytest suite (won't fail the job if there are no tests)
      - name: Run pytest suite
        shell: bash -l {0}
        run: |
          micromamba run -n dms-3d-features pytest -v --disable-warnings || \
            echo "pytest returned non-zero (no tests collected or failures) — see log above"